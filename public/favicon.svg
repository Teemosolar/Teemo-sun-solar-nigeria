<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Round container with Teemo-Sun emerald background -->
  <circle cx="32" cy="32" r="28" fill="#041a10" stroke="#fbbf24" stroke-width="2" />
  
  <!-- Abstract rising solar sunbeams behind the letters -->
  <path d="M 20 50 L 32 32 L 44 50 Z" fill="#fbbf24" opacity="0.3" />
  <path d="M 8 32 L 32 32 L 56 32 Z" stroke="#fbbf24" stroke-width="1.5" opacity="0.2" />

  <!-- Monogram letters 'T' and 'S' paired dynamically -->
  <!-- Letter T (Styled with a solar golden hue and sleek curves) -->
  <path d="M 18 20 L 46 20 M 32 20 L 32 46" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Letter S (Styled with a bright crisp white hue overlapping the T perfectly) -->
  <path d="M 22 28 C 22 21, 42 21, 42 28 C 42 34, 22 35, 22 41 C 22 47, 42 47, 42 40" stroke="#ffffff" fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- A small sun accent dot to tie the layout together -->
  <circle cx="44" cy="18" r="3" fill="#fbbf24" />
</svg>
